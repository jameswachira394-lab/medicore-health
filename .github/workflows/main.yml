name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-2
  ECR_REPO_BACKEND_DJANGO: services
  ECR_REPO_WEB: lending-web
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  web-frontend:
    name: Web (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run test --if-present -- --coverage --watchAll=false
      - run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist
          retention-days: 7

  services:
    name: services
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lending_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lending_test
      DJANGO_SECRET_KEY: test-secret-ci-only
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('services/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - run: pip install -r requirements.txt flake8 pytest pytest-cov pytest-django
      - run: flake8 .
      - run: python manage.py migrate
      - run: pytest --cov

  build-and-push-images:
    name: Build & Push Docker Images
    needs:
      - web-frontend
      - services
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
      registry: ${{ steps.ecr-registry.outputs.registry }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set ECR registry
        id: ecr-registry
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "registry=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR repositories exist
        run: |
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPO_BACKEND_DJANGO }} || aws ecr create-repository --repository-name ${{ env.ECR_REPO_BACKEND_DJANGO }}
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPO_WEB }} || aws ecr create-repository --repository-name ${{ env.ECR_REPO_WEB }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build & push backend-django image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-django
          push: true
          tags: |
            ${{ steps.ecr-registry.outputs.registry }}/${{ env.ECR_REPO_BACKEND_DJANGO }}:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr-registry.outputs.registry }}/${{ env.ECR_REPO_BACKEND_DJANGO }}:latest
          cache-from: type=gha,scope=backend-django
          cache-to: type=gha,mode=max,scope=backend-django

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: frontend/dist

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.ecr-registry.outputs.registry }}/${{ env.ECR_REPO_WEB }}:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr-registry.outputs.registry }}/${{ env.ECR_REPO_WEB }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to Amazon EKS
    needs: build-and-push-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://loan.biasharaiq.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Kubeconfig
        run: |
          # Configure kubeconfig cluster and context
          aws eks update-kubeconfig --name loanapp-ke-v2-production --region ${{ env.AWS_REGION }}

          # Newer kubectl versions strip AWS environment variables when calling exec plugins.
          # To bypass this in CI, we fetch the token directly and inject it into the kubeconfig.
          TOKEN=$(aws eks get-token --cluster-name loanapp-ke-v2-production --region ${{ env.AWS_REGION }} --output json | jq -r '.status.token')
          kubectl config set-credentials ci-user --token=$TOKEN
          kubectl config set-context --current --user=ci-user

      - name: Deploy to Kubernetes
        run: |
          echo "DEBUG: Who is GitHub Actions running as?"
          aws sts get-caller-identity

          echo "DEBUG: Updating Kubernetes manifests with ECR images..."
          REGISTRY="${{ needs.build-and-push-images.outputs.registry }}"
          TAG="${{ needs.build-and-push-images.outputs.image-tag }}"

          BACKEND_IMAGE="$REGISTRY/${{ env.ECR_REPO_BACKEND_DJANGO }}:$TAG"
          FRONTEND_IMAGE="$REGISTRY/${{ env.ECR_REPO_WEB }}:$TAG"

          # Replace local images with ECR URIs and allow image pulling
          sed -i "s|image: biashara-backend:latest|image: $BACKEND_IMAGE|g" k8s/backend-deployment.yaml
          sed -i "s|imagePullPolicy: Never|imagePullPolicy: Always|g" k8s/backend-deployment.yaml

          sed -i "s|image: biashara-frontend:latest|image: $FRONTEND_IMAGE|g" k8s/frontend-deployment.yaml
          sed -i "s|imagePullPolicy: Never|imagePullPolicy: Always|g" k8s/frontend-deployment.yaml

          # Apply namespace first to avoid alphabetical sorting race conditions
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/

          # Wait up to 10 minutes for EKS Auto Mode to provision nodes
          kubectl rollout status deployment/backend -n biashara --timeout=10m
          kubectl rollout status deployment/frontend -n biashara --timeout=10m

  notify:
    name: Notify on Deploy Result
    needs: deploy
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Send status
        run: |
          STATUS="${{ needs.deploy.result }}"
          echo "Deployment finished with status: $STATUS"
          # Wire this up to Slack/SMS/email webhook, e.g.:
          # curl -X POST -H 'Content-type: application/json' \
          #   --data "{\"text\":\"Deploy $STATUS for ${{ github.sha }}\"}" \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}
