name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-2
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  web-frontend:
    name: Web (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medicore-health-platform/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: medicore-health-platform/frontend/package-lock.json

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run test --if-present -- --coverage --watchAll=false
      - run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: medicore-health-platform/frontend/dist
          retention-days: 7

  services-test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: 
          - api-gateway
          - appointment-service
          - auth-service
          - billing-service
          - doctor-service
          - medical-records-service
          - notification-service
          - patient-service
          - reporting-service
    defaults:
      run:
        working-directory: medicore-health-platform/services/${{ matrix.service }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medicore
          POSTGRES_PASSWORD: medicore
          POSTGRES_DB: medicore
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      JWT_SECRET: dev-secret-change-in-production
      JWT_ALGORITHM: HS256
      REDIS_URL: redis://localhost:6379/0
      MEDICORE_FIELD_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.service }}-${{ hashFiles(format('medicore-health-platform/services/{0}/requirements*.txt', matrix.service)) }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.service }}-
            ${{ runner.os }}-pip-

      - name: Initialize Databases
        run: |
          for db in auth_db patient_db doctor_db appointment_db records_db billing_db notification_db reporting_db; do
            PGPASSWORD=medicore psql -h localhost -U medicore -d medicore -c "CREATE DATABASE $db;"
          done
        
      - run: pip install -r requirements.txt
      - run: |
          if [ -f "pytest.ini" ] || [ -d "tests" ]; then
            pytest --cov || echo "No tests configured yet"
          else
            echo "No tests found for ${{ matrix.service }}"
          fi

  build-and-push-images:
    name: Build & Push ${{ matrix.service }} Image
    needs:
      - web-frontend
      - services-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: 
          - api-gateway
          - appointment-service
          - auth-service
          - billing-service
          - doctor-service
          - medical-records-service
          - notification-service
          - patient-service
          - reporting-service
          - frontend
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
      registry: ${{ steps.ecr-registry.outputs.registry }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set ECR registry
        id: ecr-registry
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "registry=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR repositories exist
        run: |
          REPO_NAME="medicore-${{ matrix.service }}"
          aws ecr describe-repositories --repository-names $REPO_NAME || aws ecr create-repository --repository-name $REPO_NAME

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Download web build artifact
        if: matrix.service == 'frontend'
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: medicore-health-platform/frontend/dist

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ./medicore-health-platform/${{ matrix.service == 'frontend' && 'frontend' || format('services/{0}', matrix.service) }}
          push: true
          tags: |
            ${{ steps.ecr-registry.outputs.registry }}/medicore-${{ matrix.service }}:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr-registry.outputs.registry }}/medicore-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to Amazon EKS
    needs: build-and-push-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://loan.biasharaiq.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --name loanapp-ke-v2-production --region ${{ env.AWS_REGION }}
          TOKEN=$(aws eks get-token --cluster-name loanapp-ke-v2-production --region ${{ env.AWS_REGION }} --output json | jq -r '.status.token')
          kubectl config set-credentials ci-user --token=$TOKEN
          kubectl config set-context --current --user=ci-user

      - name: Deploy to Kubernetes
        run: |
          echo "Placeholder: Update image tags and apply Kubernetes manifests."
          echo "Please configure deployment tool (e.g. Helm, ArgoCD, or kubectl apply)."

  notify:
    name: Notify on Deploy Result
    needs: deploy
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Send status
        run: |
          STATUS="${{ needs.deploy.result }}"
          echo "Deployment finished with status: $STATUS"
