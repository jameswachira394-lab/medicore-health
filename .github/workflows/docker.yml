name: Build and Push Docker Images

on:
  workflow_run:
    workflows:
      - Security Scans
    types:
      - completed

permissions:
  contents: read
  id-token: write

concurrency:
  group: docker-build-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-2

jobs:
  build-and-push:
    name: Build & Push • ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: >
      github.event.workflow_run.conclusion == 'success'

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - service: api-gateway
            context: medicore-health-platform/services/api-gateway

          - service: appointment-service
            context: medicore-health-platform/services/appointment-service

          - service: auth-service
            context: medicore-health-platform/services/auth-service

          - service: billing-service
            context: medicore-health-platform/services/billing-service

          - service: doctor-service
            context: medicore-health-platform/services/doctor-service

          - service: medical-records-service
            context: medicore-health-platform/services/medical-records-service

          - service: notification-service
            context: medicore-health-platform/services/notification-service

          - service: patient-service
            context: medicore-health-platform/services/patient-service

          - service: reporting-service
            context: medicore-health-platform/services/reporting-service

          - service: frontend
            context: medicore-health-platform/frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Image Metadata
        id: meta
        run: |
          echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR Repository Exists
        run: |
          REPO="medicore-${{ matrix.service }}"

          aws ecr describe-repositories \
            --repository-names "$REPO" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "$REPO"

      - name: Build & Push Docker Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: true

          tags: |
            ${{ steps.login-ecr.outputs.registry }}/medicore-${{ matrix.service }}:${{ steps.meta.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/medicore-${{ matrix.service }}:latest

          labels: |
            org.opencontainers.image.title=${{ matrix.service }}
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.run_id }}

          provenance: false

      - name: Scan Docker Image (Trivy)
        uses: aquasecurity/trivy-action@0.33.1
        continue-on-error: true
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/medicore-${{ matrix.service }}:${{ steps.meta.outputs.tag }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0

      - name: Image Summary
        run: |
          echo "Service : ${{ matrix.service }}"
          echo "Image   : ${{ steps.login-ecr.outputs.registry }}/medicore-${{ matrix.service }}"
          echo "Tag     : ${{ steps.meta.outputs.tag }}"