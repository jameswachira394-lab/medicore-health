name: Build and Push Docker Images

on:
  workflow_run:
    workflows: ["Security Scans"]
    types:
      - completed

permissions:
  contents: read
  id-token: write  # Required if using OIDC for AWS auth in future

env:
  AWS_REGION: us-east-2

jobs:
  build-and-push-images:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            context: medicore-health-platform/services/api-gateway
          - service: appointment-service
            context: medicore-health-platform/services/appointment-service
          - service: auth-service
            context: medicore-health-platform/services/auth-service
          - service: billing-service
            context: medicore-health-platform/services/billing-service
          - service: doctor-service
            context: medicore-health-platform/services/doctor-service
          - service: medical-records-service
            context: medicore-health-platform/services/medical-records-service
          - service: notification-service
            context: medicore-health-platform/services/notification-service
          - service: patient-service
            context: medicore-health-platform/services/patient-service
          - service: reporting-service
            context: medicore-health-platform/services/reporting-service
          - service: frontend
            context: medicore-health-platform/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR registry
        id: ecr-registry
        run: |
          echo "registry=${{ steps.ecr-login.outputs.registry }}" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR repository exists
        run: |
          REPO_NAME="medicore-${{ matrix.service }}"
          aws ecr describe-repositories --repository-names "$REPO_NAME" 2>/dev/null \
            || aws ecr create-repository --repository-name "$REPO_NAME"

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.ecr-registry.outputs.registry }}/medicore-${{ matrix.service }}:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr-registry.outputs.registry }}/medicore-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.30.0
        continue-on-error: true  # Don't block pipeline on vulnerabilities initially
        with:
          image-ref: '${{ steps.ecr-registry.outputs.registry }}/medicore-${{ matrix.service }}:${{ steps.meta.outputs.tag }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
