name: Security Scans

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  security-scans:
    name: Run Security Tools
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python Security Tools
        run: pip install bandit pip-audit ruff

      - name: Python Bandit Scan
        run: bandit -r medicore-health-platform/services/ -f json -o bandit-report.json || true

      - name: Run Ruff (Python Linter)
        run: ruff check medicore-health-platform/services/ || true

      - name: Node NPM Audit (Frontend)
        working-directory: medicore-health-platform/frontend
        run: npm audit --audit-level=high || true
        continue-on-error: true

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.30.0
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          path: ./
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true  # Requires Code Scanning to be enabled in repo Settings → Security
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Upload SARIF as artifact (fallback)
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif-report
          path: trivy-results.sarif
          retention-days: 30

      - name: Upload SBOM
        if: always() && hashFiles('sbom.spdx.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
