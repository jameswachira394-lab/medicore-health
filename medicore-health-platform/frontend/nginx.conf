# Serves the compiled React SPA and falls back to index.html for
# client-side routes (/patient/*, /doctor/*, /admin/*). API calls go
# straight to the API Gateway from the browser (VITE_API_BASE_URL),
# not through this nginx — this container only serves static assets.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|png|jpg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
