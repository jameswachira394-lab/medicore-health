apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: medicore-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/medicore-health-platform.git
    targetRevision: develop
    path: infra/k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false

