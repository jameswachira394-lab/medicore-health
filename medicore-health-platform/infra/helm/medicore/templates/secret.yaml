{{- if .Values.global.createPlaceholderSecrets }}
# Placeholder Secrets so `helm install` succeeds standalone. In any real
# environment, disable this (global.createPlaceholderSecrets: false) and
# let the External Secrets Operator manage these from AWS Secrets Manager —
# see infra/k8s/base/security/external-secrets.yaml for the equivalent
# Kustomize-based setup this chart mirrors.
{{- range $name, $svc := .Values.services }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-secrets
  namespace: {{ $.Values.global.namespace }}
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://CHANGE_ME:CHANGE_ME@CHANGE_ME:5432/{{ replace "-" "_" $name }}"
  JWT_SECRET: "CHANGE_ME_VIA_SECRETS_MANAGER"
  REDIS_URL: "redis://CHANGE_ME:6379/0"
  MEDICORE_FIELD_ENCRYPTION_KEY: "CHANGE_ME_VIA_SECRETS_MANAGER"
---
{{- end }}
{{- end }}
