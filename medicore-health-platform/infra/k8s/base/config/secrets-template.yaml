# Secrets are NEVER committed with real values. This file documents the
# shape of each service's secret and is populated at deploy time by the
# External Secrets Operator pulling from AWS Secrets Manager (see
# infra/k8s/base/security/external-secrets.yaml), not applied directly.
apiVersion: v1
kind: Secret
metadata:
  name: SERVICE_NAME-secrets
  namespace: production
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://USER:PASSWORD@HOST:5432/DBNAME"
  JWT_SECRET: "REPLACED_BY_EXTERNAL_SECRETS_OPERATOR"
  REDIS_URL: "redis://REDIS_HOST:6379/0"
  MEDICORE_FIELD_ENCRYPTION_KEY: "REPLACED_BY_EXTERNAL_SECRETS_OPERATOR"
