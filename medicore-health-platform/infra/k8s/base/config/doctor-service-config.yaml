apiVersion: v1
kind: ConfigMap
metadata:
  name: doctor-service-config
  namespace: production
data:
  SERVICE_NAME: "doctor-service"
  ENV: "production"
  LOG_LEVEL: "INFO"
  JWT_ALGORITHM: "HS256"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
  CORS_ORIGINS: "[\"https://app.medicore.health\"]"
