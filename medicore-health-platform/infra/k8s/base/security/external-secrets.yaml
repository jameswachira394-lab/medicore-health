# Requires the External Secrets Operator to be installed in the cluster
# (helm repo external-secrets/external-secrets). Syncs each service's
# secret from AWS Secrets Manager into a native Kubernetes Secret, so
# no credentials are ever stored in Git.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: security
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: auth-service-secrets
  namespace: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: auth-service-secrets
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: medicore/production/auth-service/database-url
    - secretKey: JWT_SECRET
      remoteRef:
        key: medicore/production/shared/jwt-secret
    - secretKey: REDIS_URL
      remoteRef:
        key: medicore/production/shared/redis-url
# Repeat one ExternalSecret block per service (patient-service-secrets,
# doctor-service-secrets, ...), each pointing at its own Secrets Manager path.
