# Single entry point per the architecture doc: the frontend is served at
# app.medicore.health, and ALL API traffic goes to api.medicore.health,
# which is the api-gateway Service — it alone fans requests out to the
# 8 backend microservices. Individual services are never exposed directly.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medicore
  namespace: production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts: ["api.medicore.health", "app.medicore.health"]
      secretName: medicore-tls
  rules:
    - host: api.medicore.health
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: api-gateway, port: { number: 8000 } }
    - host: app.medicore.health
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 8080 } }
