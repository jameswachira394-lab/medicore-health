[project]
name = "medicore-common"
version = "0.1.0"
description = "Shared library for MediCore Health Platform microservices"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "pyjwt>=2.8",
  "passlib[argon2,bcrypt]>=1.7",
  "cryptography>=42.0",
  "redis>=5.0",
]
